  #     start_period: 10s

  notification:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: supai-notification-service
    environment:
      PORT: 3005
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${NOTIFICATION_DATABASE_URL:-postgresql://neondb_owner:npg_CimHrb16YtyD@ep-muddy-night-agidrotj-pooler.c-2.eu-central-1.aws.neon.tech/notification?sslmode=require&channel_binding=require}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      USER_SERVICE_URL: http://user:3007
    ports:
      - "3005:3005"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - supai-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3005/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # API Gateway
  api-gateway:
    build:
      context: ./traefik
      dockerfile: Dockerfile
    container_name: supai-api-gateway
    environment:
      PORT: 80
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_URL: http://localhost:3000
      TELEGRAM_BOT_URL: http://localhost:3006
      AUTH_SERVICE_URL: http://auth:3001
      USER_SERVICE_URL: http://user:3007
      WALLET_TRACKING_SERVICE_URL: http://wallet-tracking:3003
      NOTIFICATION_SERVICE_URL: http://notification:3005
      REDIS_URL: redis://redis:6379
      # ASSET_PRICE_SERVICE_URL: http://asset-price:3002
      # PORTFOLIO_SERVICE_URL: http://portfolio:3004
    ports:
      - "80:80"
    depends_on:
      - auth
      - redis
    networks:
      - supai-network
    restart: unless-stopped

  # Frontend Services
  frontend:
    build:
      context: ./frontend/supai
      dockerfile: Dockerfile
    container_name: supai-nextjs-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: http://localhost/api
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost/api/auth
      # Server-side URL for Docker containers to access host
      API_URL_FOR_SERVER_SIDE: http://host.docker.internal/api
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - supai-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./services/telegram-bot
      dockerfile: Dockerfile
    container_name: supai-telegram-bot
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3006
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME:-supai_wallet_bot}
      API_GATEWAY_URL: http://api-gateway/api
      USER_SERVICE_URL: http://user:3007
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      SESSION_TIMEOUT_MINUTES: 60
      MAX_RETRIES: 3
    ports:
      - "3006:3006"
    depends_on:
      api-gateway:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user:
        condition: service_healthy
    networks:
      - supai-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3006/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  rabbitmq-data:
  redis-data:

networks:
  supai-network:
