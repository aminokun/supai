services:
  # Message Queue & Cache (Databases moved to Neon cloud)
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: supai-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq_admin
      RABBITMQ_DEFAULT_PASS: rabbitmqpassword
    ports:
      - "5672:5672" # AMQP port (for services)
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - supai-network
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: supai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - supai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservices
  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: supai-auth-service
    environment:
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://neondb_owner:npg_CimHrb16YtyD@ep-muddy-night-agidrotj-pooler.c-2.eu-central-1.aws.neon.tech/auth?sslmode=require&channel_binding=require}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: http://localhost/api/auth
      TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3006
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
    ports:
      - "3001:3001"
    networks:
      - supai-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3001/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  user:
    build:
      context: ./services/user
      dockerfile: Dockerfile
    container_name: supai-user-service
    environment:
      PORT: 3007
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${USER_DATABASE_URL:-postgresql://neondb_owner:npg_CimHrb16YtyD@ep-muddy-night-agidrotj-pooler.c-2.eu-central-1.aws.neon.tech/user?sslmode=require&channel_binding=require}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
    ports:
      - "3007:3007"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - supai-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3007/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

