  wallet-tracking:
    build:
      context: ./services/wallet-tracking
      dockerfile: Dockerfile
    container_name: supai-wallet-tracking-service
    environment:
      PORT: 3003
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${WALLET_TRACKING_DATABASE_URL:-postgresql://neondb_owner:npg_CimHrb16YtyD@ep-muddy-night-agidrotj-pooler.c-2.eu-central-1.aws.neon.tech/wallet-tracking?sslmode=require&channel_binding=require}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      ALCHEMY_AUTH_TOKEN: ${ALCHEMY_AUTH_TOKEN}
      ALCHEMY_APP_ID: ${ALCHEMY_APP_ID}
      ALCHEMY_WEBHOOK_ID: ${ALCHEMY_WEBHOOK_ID}
      ALCHEMY_WEBHOOK_SIGNING_KEY: ${ALCHEMY_WEBHOOK_SIGNING_KEY}
    ports:
      - "3003:3003"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - supai-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3003/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

