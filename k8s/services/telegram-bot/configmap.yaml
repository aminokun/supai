apiVersion: v1
kind: ConfigMap
metadata:
  name: telegram-bot-config
  namespace: supai
data:
  PORT: "3006"
  NODE_ENV: "production"
  BOT_USERNAME: "supai_wallet_bot"
  API_GATEWAY_URL: "http://api-gateway/api"
  USER_SERVICE_URL: "http://user-service:3007"
  RABBITMQ_URL: "amqp://rabbitmq_admin:rabbitmqpassword@rabbitmq:5672"
  SESSION_TIMEOUT_MINUTES: "60"
  MAX_RETRIES: "3"
